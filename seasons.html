<!DOCTYPE html>
<html lang="en-GB" class="h-full bg-slate-50 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL Archive — Seasons Directory</title>
    <script>
        // Immediate dark mode initialization to prevent flash
        if (localStorage.getItem('gl_theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gwent: {
                            green: "#004942",
                            "green-light": "#00685e",
                            maroon: "#903A3D",
                            "maroon-light": "#ab484c",
                            "maroon-dark": "#6b2729"
                        }
                    },
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="data.js"></script>
    <script src="backend_tools/club_transfers.js"></script>
    <script src="backend_tools/name_changes.js"></script>
    <script src="site-layout.js"></script>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans antialiased min-h-full flex flex-col bg-[#fbfcfd] dark:bg-slate-950 transition-colors">

    <!-- GLOBAL NAVIGATION CONTAINER -->
    <div id="global-nav"></div>

    <!-- SEASONS MASTHEAD -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            <!-- Breadcrumb Navigation -->
            <nav class="flex items-center space-x-2 text-xs font-mono text-slate-500 dark:text-slate-400 mb-6" aria-label="Breadcrumb">
                <a href="index.html" class="hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors">Home</a>
                <span>/</span>
                <span class="text-slate-800 dark:text-slate-200 font-bold">Seasons Directory</span>
            </nav>

            <span class="text-xs font-mono font-bold uppercase tracking-widest text-emerald-800 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 px-2.5 py-1 rounded-md">
                Historical Archive
            </span>
            <h1 class="text-3xl md:text-5xl font-serif font-bold text-slate-900 tracking-tight mt-2">
                Seasons Directory (2010–2027)
            </h1>
            <p class="text-xs md:text-sm text-slate-500 font-medium mt-1 max-w-2xl">
                Browse through sixteen consecutive campaigns of cross country competition, individual race venues, and complete race cards.
            </p>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full flex-grow space-y-8">
        <div id="seasons-container" class="space-y-6">
            <!-- Dynamically populated season sections -->
        </div>
    </main>

    <!-- GLOBAL FOOTER CONTAINER -->
    <div id="global-footer"></div>

    <script>
        (() => {
            const allData = window.glResults || [];
            if (!allData.length) return;

            // Group by season
            const seasonsMap = new Map();
            allData.forEach(r => {
                if (!seasonsMap.has(r.season_key)) {
                    seasonsMap.set(r.season_key, {
                        season: r.season,
                        season_key: r.season_key,
                        matches: new Map(),
                        totalFinishes: 0,
                        menCount: 0,
                        womenCount: 0,
                        uniqueRunners: new Set()
                    });
                }
                const s = seasonsMap.get(r.season_key);
                s.totalFinishes++;
                if (r.gender === 'M') s.menCount++;
                else s.womenCount++;
                s.uniqueRunners.add(r.athlete);

                if (!s.matches.has(r.match)) {
                    s.matches.set(r.match, {
                        match: r.match,
                        venue: r.venue,
                        date: r.date,
                        menCount: 0,
                        womenCount: 0
                    });
                }
                const m = s.matches.get(r.match);
                if (r.gender === 'M') m.menCount++;
                else m.womenCount++;
            });

            // Sort seasons descending
            const seasonsList = Array.from(seasonsMap.values()).sort((a, b) => {
                return b.season_key.localeCompare(a.season_key);
            });

            const container = document.getElementById('seasons-container');
            container.innerHTML = seasonsList.map((s, sIdx) => {
                const matchList = Array.from(s.matches.values()).sort((a, b) => a.match - b.match);
                const isCurrent = sIdx === 0;

                return `
                    <div class="season-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-5 hover:border-slate-300 dark:hover:border-slate-700/80 transition-all">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 dark:border-slate-800/80 pb-4 gap-3">
                            <div>
                                <div class="flex items-center gap-2.5">
                                    <h2 class="text-2xl font-serif font-bold text-slate-900 dark:text-slate-100 tracking-tight">
                                        ${s.season} Campaign
                                    </h2>
                                    ${isCurrent ? `<span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase tracking-wider bg-emerald-50 dark:bg-emerald-950/70 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">Current</span>` : ''}
                                </div>
                                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-mono text-slate-500 dark:text-slate-400 mt-1">
                                    <span class="inline-flex items-center gap-1.5 font-semibold text-slate-700 dark:text-slate-300">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>${matchList.length} Fixtures
                                    </span>
                                    <span>&bull;</span>
                                    <span>${s.totalFinishes.toLocaleString()} Total Finishes</span>
                                    <span>&bull;</span>
                                    <span>${s.uniqueRunners.size.toLocaleString()} Athletes</span>
                                </div>
                            </div>
                            <a href="season.html?season=${s.season_key}" class="px-4 py-2 text-xs font-mono font-semibold text-slate-700 dark:text-slate-200 bg-slate-50 dark:bg-slate-800/80 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 hover:text-emerald-700 dark:hover:text-emerald-300 border border-slate-200 dark:border-slate-700 rounded-xl transition-all shadow-xs flex items-center gap-1.5 group shrink-0">
                                <span>View Season Standings</span>
                                <span class="group-hover:translate-x-0.5 transition-transform">&rarr;</span>
                            </a>
                        </div>

                        <!-- Fixtures Row -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                            ${matchList.map(m => `
                                <a href="results.html?season=${s.season_key}&match=${m.match}" class="season-fixture-card group flex flex-col justify-between p-4 rounded-xl border border-slate-200/90 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/50 hover:bg-white dark:hover:bg-slate-800 hover:border-emerald-500/60 dark:hover:border-emerald-500/60 hover:shadow-sm transition-all duration-150">
                                    <div>
                                        <div class="flex justify-between items-center text-[10px] font-mono gap-1 mb-2.5">
                                            <span class="font-bold text-slate-800 dark:text-emerald-300 bg-white dark:bg-emerald-950/80 border border-slate-200 dark:border-emerald-800/60 px-2 py-0.5 rounded shadow-xs">
                                                Race ${m.match}
                                            </span>
                                            <span class="text-slate-400 dark:text-slate-400 truncate">${m.date || 'TBD'}</span>
                                        </div>
                                        <div class="text-sm font-serif font-bold text-slate-900 dark:text-slate-100 group-hover:text-emerald-700 dark:group-hover:text-emerald-400 transition-colors line-clamp-1" title="${m.venue}">
                                            ${m.venue || 'Gwent League Race'}
                                        </div>
                                    </div>
                                    <div class="mt-3 pt-2.5 border-t border-slate-200/60 dark:border-slate-800 flex items-center justify-between text-[11px] font-mono text-slate-500 dark:text-slate-400">
                                        <span class="font-bold text-slate-700 dark:text-slate-300">${m.menCount + m.womenCount} finishers</span>
                                        <span class="text-[10px] text-slate-400 dark:text-slate-400">(${m.menCount}M / ${m.womenCount}F)</span>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        })();
    </script>
</body>
</html>
