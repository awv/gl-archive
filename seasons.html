<!DOCTYPE html>
<html lang="en-GB" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL Archive — Seasons Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="data.js"></script>
    <script src="site-layout.js"></script>
    <style>
        body { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased min-h-full flex flex-col bg-[#fbfcfd]">

    <!-- GLOBAL NAVIGATION CONTAINER -->
    <div id="global-nav"></div>

    <!-- SEASONS MASTHEAD -->
    <header class="border-b border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
            <span class="text-xs font-mono font-bold uppercase tracking-widest text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded">
                Historical Archive
            </span>
            <h1 class="text-3xl md:text-5xl font-serif font-bold text-slate-900 tracking-tight mt-2">
                Seasons Directory (2010–2026)
            </h1>
            <p class="text-xs md:text-sm text-slate-500 font-medium mt-1 max-w-2xl">
                Browse through fifteen consecutive campaigns of cross country competition, individual match venues, and complete race cards.
            </p>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full flex-grow space-y-8">
        <div id="seasons-container" class="space-y-6">
            <!-- Dynamically populated season sections -->
        </div>
    </main>

    <!-- GLOBAL FOOTER CONTAINER -->
    <div id="global-footer"></div>

    <script>
        (() => {
            const allData = window.glResults || [];
            if (!allData.length) return;

            // Group by season
            const seasonsMap = new Map();
            allData.forEach(r => {
                if (!seasonsMap.has(r.season_key)) {
                    seasonsMap.set(r.season_key, {
                        season: r.season,
                        season_key: r.season_key,
                        matches: new Map(),
                        totalFinishes: 0,
                        menCount: 0,
                        womenCount: 0,
                        uniqueRunners: new Set()
                    });
                }
                const s = seasonsMap.get(r.season_key);
                s.totalFinishes++;
                if (r.gender === 'M') s.menCount++;
                else s.womenCount++;
                s.uniqueRunners.add(r.athlete);

                if (!s.matches.has(r.match)) {
                    s.matches.set(r.match, {
                        match: r.match,
                        venue: r.venue,
                        date: r.date,
                        menCount: 0,
                        womenCount: 0
                    });
                }
                const m = s.matches.get(r.match);
                if (r.gender === 'M') m.menCount++;
                else m.womenCount++;
            });

            // Sort seasons descending
            const seasonsList = Array.from(seasonsMap.values()).sort((a, b) => {
                return b.season_key.localeCompare(a.season_key);
            });

            const container = document.getElementById('seasons-container');
            container.innerHTML = seasonsList.map(s => {
                const matchList = Array.from(s.matches.values()).sort((a, b) => a.match - b.match);

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-4 gap-2">
                            <div>
                                <h2 class="text-2xl font-serif font-bold text-slate-900 tracking-tight">
                                    ${s.season} Campaign
                                </h2>
                                <div class="flex items-center gap-3 text-xs font-mono text-slate-500 mt-0.5">
                                    <span>${matchList.length} Fixtures</span>
                                    <span>&bull;</span>
                                    <span>${s.totalFinishes.toLocaleString()} Total Finishes</span>
                                    <span>&bull;</span>
                                    <span>${s.uniqueRunners.size.toLocaleString()} Athletes</span>
                                </div>
                            </div>
                            <a href="season.html?season=${s.season_key}" class="px-3.5 py-1.5 text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition-colors">
                                View Season Standings &rarr;
                            </a>
                        </div>

                        <!-- Fixtures Row -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                            ${matchList.map(m => `
                                <a href="results.html?season=${s.season_key}&match=${m.match}" class="block p-3.5 rounded-xl border border-slate-100 bg-slate-50/60 hover:bg-white hover:border-slate-300 hover:shadow-sm transition-all group">
                                    <div class="flex justify-between items-center text-[10px] font-mono text-slate-400">
                                        <span class="font-bold text-slate-700 bg-white border border-slate-200 px-1.5 py-0.5 rounded">Match ${m.match}</span>
                                        <span>${m.date}</span>
                                    </div>
                                    <div class="text-xs font-serif font-bold text-slate-900 group-hover:text-emerald-900 transition-colors mt-2 truncate">
                                        ${m.venue}
                                    </div>
                                    <div class="text-[10px] font-mono text-slate-500 mt-2">
                                        ${m.menCount + m.womenCount} finishers (${m.menCount}M / ${m.womenCount}F)
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        })();
    </script>
</body>
</html>
